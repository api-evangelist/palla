aid: palla
name: Palla
description: >-
  Palla Financial is a fintech infrastructure company that powers instant
  cross-border peer-to-peer (P2P) money transfers to 180+ countries. The Palla
  Platform Partner API lets trusted partners embed transfers into their own
  apps: exchange partner client credentials for a user-scoped Bearer token, then
  create and manage a user's Account, encrypted Payment Methods, relationship
  Links, Relationships, and Transfers, with server-to-server transfer callbacks.
  Palla also ships embeddable UI (Embed, Checkout, Redirect) and a JavaScript
  Web SDK, with PCI-scoped card storage plus KYC, OFAC, card verification, fraud
  prevention, and transaction monitoring built in. Backed by Cowboy Ventures.
